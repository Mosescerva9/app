[project]
name = "discord-webull-options-bot"
version = "0.1.0"
description = "Low-latency Discord options alert copier for Webull"
requires-python = ">=3.10"
dependencies = [
  "discord.py>=2.4.0",
  "webull-openapi-python-sdk>=1.0.0",
  "python-dotenv>=1.0.0",
  "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]