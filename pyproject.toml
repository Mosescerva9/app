[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.2.0"
description = "AI-assisted trading research system (Webull-integrated, approval-gated)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "webull-openapi-python-sdk>=1.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
trading-system = "trading_system.cli:main"

[tool.setuptools.packages.find]
include = ["trading_system*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
